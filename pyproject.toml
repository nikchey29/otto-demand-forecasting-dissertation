[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otto-demand-forecasting"
version = "2.0.0"
description = "Research-grade multi-horizon forecasting of aggregate e-commerce demand volumes"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Chaithanya Vemuri"}]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.5,<2",
  "torch>=2.4,<3",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1"
]

[project.scripts]
otto-forecast = "otto_forecasting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["otto_forecasting"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 65
