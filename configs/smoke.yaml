# Fast end-to-end validation on generated synthetic data. These are not dissertation results.
seed: 42
output_dir: artifacts/smoke
data:
  raw_path: data/raw/not_used.jsonl
  processed_path: data/processed/synthetic_hourly.csv
  frequency: 1h
  lookback: 48
  horizon: 12
  validation_steps: 36
  test_steps: 36
  seasonalities: [24]
model:
  d_model: 16
  nhead: 4
  num_layers: 1
  dim_feedforward: 32
  dropout: 0.10
gru:
  hidden_size: 16
  num_layers: 1
  dropout: 0.10
baselines:
  ridge_alphas: [0.1, 1.0, 10.0]
  extra_trees_estimators: 20
  extra_trees_min_samples_leaf: 2
  extra_trees_max_features: 0.8
training:
  batch_size: 32
  epochs: 2
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 2
  gradient_clip: 1.0
  num_workers: 0
research:
  seeds: [42]
  cv_folds: 1
  cv_stride: 12
  cv_validation_steps: 24
  cv_test_steps: 24
  final_validation_steps: 36
  final_test_steps: 36
  conformal_alpha: 0.10
  bootstrap_samples: 100
  bootstrap_block_size: 6
  run_gru: false
  run_extra_trees: true
  run_ablations: false
  ablation_seeds: [42]
  ablation_lookbacks: [24]
  ablation_feature_sets: [full]
  ablation_transformer_layers: [1]
