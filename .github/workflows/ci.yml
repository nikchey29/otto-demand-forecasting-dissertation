name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Static quality checks
        run: python scripts/check_quality.py
      - name: Tests and coverage
        run: pytest --cov=otto_forecasting --cov-report=term-missing --cov-fail-under=65 -q
      - name: CLI smoke checks
        run: |
          otto-forecast --help
          otto-forecast make-smoke-data --output /tmp/otto_synthetic.csv --hours 320
          otto-forecast audit-data --input /tmp/otto_synthetic.csv
